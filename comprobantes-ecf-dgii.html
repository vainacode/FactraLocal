/* =====================================================================
   UTILIDADES
===================================================================== */
function money(v, cur){
  const c = cur || "DOP";
  const s = new Intl.NumberFormat("es-DO",{minimumFractionDigits:2,maximumFractionDigits:2}).format(v);
  return (c === "USD" ? "US$" : "RD$") + s;
}

function calc(t){
  let sub = 0, itbis = 0;
  t.items.forEach(i => { const imp = i.cant * i.precio; sub += imp; itbis += imp * i.itbis; });
  const total = sub + itbis;
  let retIt = 0, retIsr = 0;
  if (t.retenciones){
    if (t.retenciones.itbisPct) retIt = itbis * t.retenciones.itbisPct;
    if (t.retenciones.isrPct)  retIsr = sub * t.retenciones.isrPct;
  }
  return { sub, itbis, total, retIt, retIsr, neto: total - retIt - retIsr };
}

function fmtFechaQR(f){ return f.split("/").join("-"); } // dd-mm-aaaa

/* URL del QR según especificación técnica de la DGII */
function qrURL(t){
  const c = calc(t);
  const montoDOP = t.moneda === "USD" ? c.total * t.tasaCambio : c.total;
  const monto = montoDOP.toFixed(2);
  const cod = "aB3xZ9";
  // Factura de Consumo < RD$250,000 → consulta simplificada (fc.dgii.gov.do)
  if (t.encf.startsWith("E32") && montoDOP < 250000){
    return "https://fc.dgii.gov.do/eCF/ConsultaTimbreFC?RncEmisor=" + EMISOR.rnc +
           "&ENCF=" + t.encf + "&MontoTotal=" + monto + "&CodigoSeguridad=" + cod;
  }
  let u = "https://ecf.dgii.gov.do/ecf/ConsultaTimbre?RncEmisor=" + EMISOR.rnc;
  if (t.comprador && t.comprador.rnc) u += "&RncComprador=" + t.comprador.rnc;
  u += "&ENCF=" + t.encf +
       "&FechaEmision=" + fmtFechaQR(HOY) +
       "&MontoTotal=" + monto +
       "&FechaFirma=" + encodeURIComponent(fmtFechaQR(FECHA_FIRMA.split(" ")[0]) + " " + FECHA_FIRMA.split(" ")[1]) +
       "&CodigoSeguridad=" + cod;
  return u;
}

function makeQR(elId, t, size){
  const el = document.getElementById(elId);
  if (!el || typeof QRCode === "undefined") return;
  new QRCode(el, { text: qrURL(t), width: size, height: size, correctLevel: QRCode.CorrectLevel.M });
}

/* =====================================================================
   RENDER — FORMATO A4
===================================================================== */
function renderA4(cod, t){
  const c = calc(t);
  const cur = t.moneda || "DOP";
  const filas = t.items.map(i => {
    const imp = i.cant * i.precio;
    return '<tr><td class="ctr">' + i.cant + '</td><td>' + i.desc + '</td>' +
      '<td class="num">' + money(i.precio, cur) + '</td>' +
      '<td class="num">' + (i.itbis > 0 ? money(imp * i.itbis, cur) : (t.exento || t.exportacion ? "E" : "—")) + '</td>' +
      '<td class="num">' + money(imp, cur) + '</td></tr>';
  }).join("");

  // Panel comprador / proveedor
  let panelComp = "";
  if (t.comprador){
    const idLbl = t.comprador.esCedula ? "Cédula" : "RNC";
    panelComp =
      '<div class="panel"><h3>' + t.comprador.titulo + '</h3><div class="rows">' +
      (t.comprador.rnc ? '<div class="row"><b>' + idLbl + ':</b><span>' + t.comprador.rnc + '</span></div>' : "") +
      '<div class="row"><b>Razón social:</b><span>' + t.comprador.nombre + '</span></div>' +
      (t.comprador.dir ? '<div class="row"><b>Dirección:</b><span>' + t.comprador.dir + '</span></div>' : "") +
      (t.comprador.pais ? '<div class="row"><b>País:</b><span>' + t.comprador.pais + '</span></div>' : "") +
      '</div></div>';
  }

  // Panel e-CF modificado (NC / ND)
  let panelMod = "";
  if (t.modifica){
    panelMod =
      '<div class="panel"><h3>Comprobante modificado</h3><div class="rows">' +
      '<div class="row"><b>e-NCF modificado:</b><span style="font-family:var(--mono);font-weight:700">' + t.modifica.encf + '</span></div>' +
      '<div class="row"><b>Fecha emisión:</b><span>' + t.modifica.fecha + '</span></div>' +
      '<div class="row"><b>Razón modificación:</b><span>' + t.modifica.razon + '</span></div>' +
      '</div></div>';
  }

  const panelDatos =
    '<div class="panel"><h3>Datos del comprobante</h3><div class="rows">' +
    '<div class="row"><b>Fecha emisión:</b><span>' + HOY + '</span></div>' +
    '<div class="row"><b>Condición de pago:</b><span>' + t.condicion + '</span></div>' +
    (t.moneda === "USD" ? '<div class="row"><b>Moneda / Tasa:</b><span>USD — RD$' + t.tasaCambio.toFixed(2) + ' por US$1.00</span></div>' : "") +
    '</div></div>';

  const paneles = [panelComp, panelMod, panelDatos].filter(Boolean).join("");
  const gridCls = "meta-grid" + ((panelComp?1:0)+(panelMod?1:0)+1 === 1 ? " single" : "");

  // Totales
  let tot =
    '<div class="t-row"><span>Subtotal ' + (t.exento || t.exportacion ? "exento" : (t.sinItbis ? "" : "gravado")) + '</span><span>' + money(c.sub, cur) + '</span></div>';
  if (!t.sinItbis){
    tot += '<div class="t-row"><span>ITBIS (18%)</span><span>' + (c.itbis > 0 ? money(c.itbis, cur) : (t.exento || t.exportacion ? "Exento (E)" : money(0, cur))) + '</span></div>';
  }
  tot += '<div class="t-row grand"><span>TOTAL</span><span>' + money(c.total, cur) + '</span></div>';
  if (c.retIt > 0)  tot += '<div class="t-row retencion"><span>Retención ITBIS (100%)</span><span>-' + money(c.retIt, cur) + '</span></div>';
  if (c.retIsr > 0) tot += '<div class="t-row retencion"><span>Retención ISR (' + Math.round(t.retenciones.isrPct * 100) + '%)</span><span>-' + money(c.retIsr, cur) + '</span></div>';
  if (c.retIt > 0 || c.retIsr > 0) tot += '<div class="t-row" style="font-weight:700"><span>Neto a pagar</span><span>' + money(c.neto, cur) + '</span></div>';
  if (t.moneda === "USD") tot += '<div class="t-row usd"><span>Equivalente:</span><span>' + money(c.total * t.tasaCambio, "DOP") + '</span></div>';

  return '' +
  '<div class="sheet-a4">' +
    '<div class="a4-head">' +
      '<div class="emisor">' +
        '<div class="logo">BELLOTA<span>HOSTING</span></div>' +
        '<p><b>' + EMISOR.razon + '</b> · RNC: ' + EMISOR.rnc + '</p>' +
        '<p>' + EMISOR.direccion + '</p>' +
        '<p>Tel: ' + EMISOR.tel + ' · ' + EMISOR.email + ' · ' + EMISOR.web + '</p>' +
      '</div>' +
      '<div class="ncf-box">' +
        '<div class="tipo">' + t.nombre + '</div>' +
        '<div class="encf">' + t.encf + '</div>' +
        '<div class="venc">Tipo ' + cod + ' · Vencimiento secuencia: ' + VENC_SEC + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="' + gridCls + '">' + paneles + '</div>' +
    '<table class="items"><thead><tr>' +
      '<th class="ctr" style="width:52px">Cant.</th><th>Descripción</th>' +
      '<th class="num" style="width:110px">Precio unit.</th>' +
      '<th class="num" style="width:100px">ITBIS</th>' +
      '<th class="num" style="width:120px">Importe</th>' +
    '</tr></thead><tbody>' + filas + '</tbody></table>' +
    '<div class="bottom">' +
      '<div class="obs">' +
        (t.exportacion ? '<div class="panel"><h3>Observaciones</h3><div class="rows"><div class="row">Operación de exportación de servicios — ITBIS tasa 0% (Art. 342 Código Tributario).</div></div></div>' : "") +
        (t.pagoExterior ? '<div class="panel"><h3>Observaciones</h3><div class="rows"><div class="row">Retención ISR 27% sobre pagos girados al exterior — Art. 305 Código Tributario.</div></div></div>' : "") +
        (t.exento ? '<div class="panel"><h3>Observaciones</h3><div class="rows"><div class="row">Venta exenta de ITBIS — comprador acogido a régimen especial de tributación.</div></div></div>' : "") +
        '<p style="margin-top:8px">Documento emitido conforme a la Ley 32-23 de Facturación Electrónica y la Norma General 01-2020 de la DGII. Verifique la validez de este e-CF escaneando el código QR.</p>' +
      '</div>' +
      '<div class="totales">' + tot + '</div>' +
    '</div>' +
    '<div class="sello">' +
      '<div class="qr-a4" id="qrA4"></div>' +
      '<div class="sello-info">' +
        '<div class="lbl">Código de seguridad</div>' +
        '<div class="cod">aB3xZ9</div>' +
        '<div style="margin-top:6px"><span class="lbl">Fecha de firma digital:</span> ' + FECHA_FIRMA + '</div>' +
        '<div><span class="lbl">Consulta:</span> ecf.dgii.gov.do</div>' +
      '</div>' +
    '</div>' +
    '<div class="a4-footer">' + EMISOR.razon + ' · RNC ' + EMISOR.rnc + ' — Comprobante Fiscal Electrónico (e-CF) · Página 1 de 1</div>' +
  '</div>';
}

/* =====================================================================
   RENDER — TICKET 80mm
===================================================================== */
function renderTicket(cod, t){
  const c = calc(t);
  const cur = t.moneda || "DOP";
  const filas = t.items.map(i => {
    const imp = i.cant * i.precio;
    return '<tr><td>' + i.cant + '</td><td class="tk-desc">' + i.desc + '</td>' +
           '<td class="num">' + money(imp, cur) + '</td></tr>';
  }).join("");

  let comp = "";
  if (t.comprador && t.comprador.nombre !== "Consumidor Final"){
    const idLbl = t.comprador.esCedula ? "Céd" : "RNC";
    comp = '<hr class="tk-sep">' +
      '<div class="tk-small"><b>' + t.comprador.titulo.toUpperCase() + ':</b></div>' +
      '<div class="tk-small">' + t.comprador.nombre + '</div>' +
      (t.comprador.rnc ? '<div class="tk-small">' + idLbl + ': ' + t.comprador.rnc + '</div>' : "") +
      (t.comprador.pais ? '<div class="tk-small">País: ' + t.comprador.pais + '</div>' : "");
  } else if (t.comprador){
    comp = '<hr class="tk-sep"><div class="tk-small">Cliente: Consumidor Final</div>';
  }

  let mod = "";
  if (t.modifica){
    mod = '<hr class="tk-sep">' +
      '<div class="tk-small"><b>MODIFICA e-NCF:</b> ' + t.modifica.encf + '</div>' +
      '<div class="tk-small">Fecha: ' + t.modifica.fecha + '</div>' +
      '<div class="tk-small">' + t.modifica.razon + '</div>';
  }

  let tot = '<div class="tk-kv"><span>SUBTOTAL' + (t.exento || t.exportacion ? " EXENTO" : "") + '</span><span>' + money(c.sub, cur) + '</span></div>';
  if (!t.sinItbis){
    tot += '<div class="tk-kv"><span>ITBIS 18%</span><span>' + (c.itbis > 0 ? money(c.itbis, cur) : "EXENTO") + '</span></div>';
  }
  tot += '<div class="tk-kv grand"><span>TOTAL</span><span>' + money(c.total, cur) + '</span></div>';
  if (c.retIt > 0)  tot += '<div class="tk-kv"><span>RET. ITBIS 100%</span><span>-' + money(c.retIt, cur) + '</span></div>';
  if (c.retIsr > 0) tot += '<div class="tk-kv"><span>RET. ISR ' + Math.round(t.retenciones.isrPct*100) + '%</span><span>-' + money(c.retIsr, cur) + '</span></div>';
  if (c.retIt > 0 || c.retIsr > 0) tot += '<div class="tk-kv" style="font-weight:700"><span>NETO A PAGAR</span><span>' + money(c.neto, cur) + '</span></div>';
  if (t.moneda === "USD") tot += '<div class="tk-kv tk-small"><span>Equiv. DOP</span><span>' + money(c.total * t.tasaCambio, "DOP") + '</span></div>';

  return '' +
  '<div class="sheet-ticket">' +
    '<div class="tk-center">' +
      '<div class="tk-emisor">' + EMISOR.razon + '</div>' +
      '<div class="tk-small">RNC: ' + EMISOR.rnc + '</div>' +
      '<div class="tk-small">' + EMISOR.direccion + '</div>' +
      '<div class="tk-small">Tel: ' + EMISOR.tel + '</div>' +
    '</div>' +
    '<hr class="tk-sep">' +
    '<div class="tk-center">' +
      '<div class="tk-tipo">' + t.nombre + '</div>' +
      '<div class="tk-encf">e-NCF: ' + t.encf + '</div>' +
      '<div class="tk-small">Venc. secuencia: ' + VENC_SEC + '</div>' +
    '</div>' +
    '<hr class="tk-sep">' +
    '<div class="tk-kv tk-small"><span>Fecha:</span><span>' + HOY + '</span></div>' +
    '<div class="tk-kv tk-small"><span>Condición:</span><span>' + t.condicion + '</span></div>' +
    (t.moneda === "USD" ? '<div class="tk-kv tk-small"><span>Tasa cambio:</span><span>RD$' + t.tasaCambio.toFixed(2) + '</span></div>' : "") +
    comp + mod +
    '<hr class="tk-sep">' +
    '<table class="tk-items"><thead><tr><th style="width:24px">Cant</th><th>Descripción</th><th class="num" style="width:78px">Importe</th></tr></thead>' +
    '<tbody>' + filas + '</tbody></table>' +
    '<hr class="tk-sep">' +
    '<div class="tk-tot">' + tot + '</div>' +
    '<div class="qr-tk" id="qrTk"></div>' +
    '<div class="tk-center">' +
      '<div class="tk-small">CÓDIGO DE SEGURIDAD</div>' +
      '<div class="tk-cod">aB3xZ9</div>' +
      '<div class="tk-small">Firma digital: ' + FECHA_FIRMA + '</div>' +
      '<div class="tk-small">Verifique en ecf.dgii.gov.do</div>' +
      '<hr class="tk-sep">' +
      '<div class="tk-small">*** GRACIAS POR SU PREFERENCIA ***</div>' +
      '<div class="tk-small">' + EMISOR.web + '</div>' +
    '</div>' +
  '</div>';
}

/* =====================================================================
   CONTROL DE VISTA
===================================================================== */
let formato = "a4";

function setFormato(f){
  formato = f;
  document.getElementById("btnA4").classList.toggle("active", f === "a4");
  document.getElementById("btnTk").classList.toggle("active", f === "ticket");
  document.body.classList.toggle("print-ticket", f === "ticket");
  render();
}

function render(){
  const cod = document.getElementById("selTipo").value;
  const t = TIPOS[cod];
  document.getElementById("nota").innerHTML = "<b>e-CF Tipo " + cod + " — " + t.nombre + "</b>" + t.nota;
  document.getElementById("docArea").innerHTML = (formato === "a4") ? renderA4(cod, t) : renderTicket(cod, t);
  makeQR(formato === "a4" ? "qrA4" : "qrTk", t, formato === "a4" ? 100 : 84);
}

/* Inicializar selector */
(function(){
  const sel = document.getElementById("selTipo");
  Object.keys(TIPOS).forEach(cod => {
    const o = document.createElement("option");
    o.value = cod;
    o.textContent = cod + " — " + TIPOS[cod].nombre;
    sel.appendChild(o);
  });
  render();
})();
</script>
